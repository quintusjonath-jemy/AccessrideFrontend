<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 m-0 p-0 flex justify-center">

  <div class="w-full max-w-md bg-slate-50 min-h-screen pb-[90px] relative flex flex-col">
    <!-- Header -->
    <header class="flex justify-between items-center p-4 bg-slate-50 sticky top-0 z-10">
      <button class="text-[#0d1b2a]"><i data-lucide="menu"></i></button>
      <h1 class="text-xl font-extrabold text-[#0d1b2a] m-0">AccessRide</h1>
      <button class="text-[#0d1b2a] flex items-center justify-center"><i data-lucide="circle-user" class="w-7 h-7"></i></button>
    </header>
    
    <!-- Main Content -->
    <main class="flex-1 px-5 pb-5 flex flex-col gap-4">
      
        <!-- Voice Search FAB -->
      <div class="flex flex-col items-center mt-7 mb-5">
        <button class="w-[90px] h-[90px] bg-[#ffb703] rounded-full flex items-center justify-center shadow-[0_6px_16px_rgba(255,183,3,0.4)] active:scale-95 transition-transform mb-4 border-none">
          <i data-lucide="mic" class="w-8 h-8 text-[#0d1b2a]"></i>
        </button>
        <span class="font-extrabold text-[#0d1b2a] text-[1.1rem]">Search rides by voice</span>
      </div>

      <!-- Status Banner -->
      <div class="flex items-center gap-2.5 bg-white border border-[#0d1b2a] rounded-lg py-3.5 px-4 font-bold text-[#0d1b2a] text-[0.95rem]">
        <i data-lucide="audio-lines" class="text-[#ffb703] w-5 h-5"></i>
        <span>Showing your Profile</span>
      </div>

      <!-- Profile Card -->
      <div class="bg-white border border-slate-300 rounded-xl p-5 flex flex-col items-center shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
        <div class="relative mb-4">
          <div class="w-[100px] h-[100px] rounded-full border-[2px] border-[#0d1b2a] bg-white"></div>
          <div class="absolute bottom-0 right-0 bg-white rounded-full p-[2px] flex">
            <i data-lucide="badge-check" class="text-[#0d1b2a] fill-[#ffb703] w-7 h-7"></i>
          </div>
        </div>
        <h2 class="text-[1.5rem] font-extrabold text-[#0d1b2a] m-0 mb-3">James Dalton</h2>
        
        <div class="flex flex-col gap-2 mb-6 w-full">
          <div class="flex items-center justify-center gap-2.5 text-slate-500 font-medium text-[0.95rem]">
            <i data-lucide="phone" class="w-3.5 h-3.5"></i>
            <span>+1 (555) 123-4567</span>
          </div>
          <div class="flex items-center justify-center gap-2.5 text-slate-500 font-medium text-[0.95rem]">
            <i data-lucide="mail" class="w-3.5 h-3.5"></i>
            <span>j.dalton@example.com</span>
          </div>
        </div>

        <button class="w-full bg-[#0d1b2a] text-white py-3.5 rounded-lg font-bold flex justify-center items-center gap-2.5 active:opacity-80 transition-opacity text-base">
          <i data-lucide="pencil" class="w-4 h-4"></i> Edit Profile
        </button>
      </div>

      <!-- Accessibility Card -->
      <div class="bg-white border border-slate-300 rounded-xl p-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
        <div class="flex items-center gap-3 mb-5">
          <i data-lucide="accessibility" class="text-[#0d1b2a] w-6 h-6"></i>
          <h3 class="text-[1.15rem] font-extrabold text-[#0d1b2a] m-0">Accessibility</h3>
        </div>
        
        <div class="bg-slate-50 border border-slate-300 rounded-lg py-3.5 px-4 mb-3 flex justify-between items-center">
          <span class="font-bold text-[0.95rem] text-slate-800">High Contrast Mode</span>
          <!-- Tailwind Toggle -->
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" value="" class="sr-only peer">
            <div class="w-12 h-6 bg-slate-500 rounded-full peer peer-checked:after:translate-x-6 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[20px] after:w-[20px] after:transition-all peer-checked:bg-[#0d1b2a]"></div>
          </label>
        </div>

        <div class="bg-slate-50 border border-slate-300 rounded-lg py-3.5 px-4">
          <span class="font-bold text-[0.95rem] text-slate-800 block mb-4">Text Size</span>
          <div class="flex items-center gap-4 px-1">
            <span class="font-extrabold text-slate-800 text-[0.85rem]">A</span>
            <input type="range" min="1" max="3" value="2" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-5 [&::-webkit-slider-thumb]:h-5 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border-[2px] [&::-webkit-slider-thumb]:border-[#0d1b2a]">
            <span class="font-extrabold text-slate-800 text-[1.15rem]">AAA</span>
          </div>
        </div>
      </div>

      <!-- Voice Settings Card -->
      <div class="bg-white border border-slate-300 rounded-xl p-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
        <div class="flex items-center gap-3 mb-5">
          <i data-lucide="mic" class="text-[#0d1b2a] w-6 h-6"></i>
          <h3 class="text-[1.15rem] font-extrabold text-[#0d1b2a] m-0">Voice Settings</h3>
        </div>
        
        <div class="bg-slate-50 border border-slate-300 rounded-lg py-3.5 px-4 mb-3 flex justify-between items-center">
          <span class="font-bold text-[0.95rem] text-slate-800">Voice Guidance</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" value="" class="sr-only peer" checked>
            <div class="w-12 h-6 bg-slate-500 rounded-full peer peer-checked:after:translate-x-6 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[20px] after:w-[20px] after:transition-all peer-checked:bg-[#ffb703]"></div>
          </label>
        </div>

        <div class="bg-slate-50 border border-slate-300 rounded-lg py-3.5 px-4">
          <span class="font-bold text-[0.95rem] text-slate-800 block mb-3">Voice Speed</span>
          <div class="flex bg-slate-200 rounded-lg p-1 gap-1" id="voice-speed-control">
            <button class="speed-btn flex-1 py-2.5 rounded-md font-bold text-[0.9rem] text-slate-800 transition-colors">Slow</button>
            <button class="speed-btn active flex-1 py-2.5 rounded-md font-bold text-[0.9rem] bg-[#0d1b2a] text-white transition-colors shadow">Normal</button>
            <button class="speed-btn flex-1 py-2.5 rounded-md font-bold text-[0.9rem] text-slate-800 transition-colors">Fast</button>
          </div>
        </div>
      </div>

      <!-- List Items -->
      <div class="flex flex-col gap-4 mt-1">
        <button class="flex items-center justify-between bg-white border border-slate-300 rounded-lg py-4 px-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-4 text-[#0d1b2a] font-extrabold text-[1.05rem]">
            <i data-lucide="locate-fixed" class="w-5 h-5"></i>
            <span>Emergency Contacts</span>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i>
        </button>

        <button class="flex items-center justify-between bg-white border border-slate-300 rounded-lg py-4 px-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-4 text-[#0d1b2a] font-extrabold text-[1.05rem]">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span>Notifications</span>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i>
        </button>
      </div>

      <!-- Logout Button -->
      <button class="flex items-center justify-between bg-[#ffb703] border border-[#ffb703] rounded-lg py-4 px-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform mt-1">
        <div class="flex items-center gap-4 text-[#0d1b2a] font-extrabold text-[1.05rem]">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>Logout</span>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-[#0d1b2a]"></i>
      </button>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-[70px] bg-white flex justify-around items-center rounded-t-[12px] shadow-[0_-2px_10px_rgba(0,0,0,0.05)] px-2 z-20">
      <a href="../index.html" class="flex flex-col items-center gap-1 py-2 px-[30px] rounded-xl font-bold text-[0.8rem] text-slate-500 transition-colors no-underline">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span>Home</span>
      </a>
      <a href="../history-page/index.html" class="flex flex-col items-center gap-1 py-2 px-[30px] rounded-xl font-bold text-[0.8rem] text-slate-500 transition-colors no-underline">
        <i data-lucide="calendar-days" class="w-6 h-6"></i>
        <span>History</span>
      </a>
      <a href="./index.html" class="flex flex-col items-center gap-1 py-2 px-[30px] rounded-xl font-bold text-[0.8rem] bg-[#ffb703] text-[#0d1b2a] transition-colors no-underline">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
