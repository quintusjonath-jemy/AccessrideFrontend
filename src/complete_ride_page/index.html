<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Completed</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="top-nav">
            <i class="fa-solid fa-bars nav-icon"></i>
            <h1 class="logo-text">AccessRide</h1>
            <i class="fa-regular fa-bell nav-icon"></i>
        </header>

        <!-- Tabs -->
        <div class="tabs-container">
            <button class="tab">All</button>
            <button class="tab">Upcoming</button>
            <button class="tab active">Completed</button>
            <button class="tab">Cancelled</button>
        </div>

        <!-- Voice Booking CTA -->
        <div class="voice-cta">
            <div class="mic-button-wrapper">
                <button class="mic-button">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div class="mic-shadow"></div>
            </div>
            <h3>Book new ride by voice</h3>
        </div>

        <!-- Main Content -->
        <main class="content-area">
            <h2 class="section-title">Today, June 24</h2>

            <!-- Main Card -->
            <div class="card">
                <!-- Status Row -->
                <div class="status-row">
                    <div class="status-badge">
                        <i class="fa-regular fa-circle-check"></i> Completed
                    </div>
                    <div class="date-time">June 24, 09:30 AM</div>
                </div>

                <!-- Driver & Car Info (Nested Card) -->
                <div class="nested-card">
                    <div class="driver-info">
                        <div class="avatar">M</div>
                        <div class="driver-details">
                            <span class="driver-name">Michael C.</span>
                            <div class="accessibility-info">
                                <i class="fa-solid fa-wheelchair" style="color: #f59e0b;"></i>
                                <span>Wheelchair Accessible</span>
                            </div>
                        </div>
                    </div>
                    <div class="car-info">
                        <span class="car-model">Honda Odyssey</span>
                        <span class="license-plate">ABC-123</span>
                    </div>
                </div>

                <div class="details-divider"></div>
                
                <!-- Fare & Route details -->
                <div class="fare-info">
                    <span class="fare-label">Total Fare</span>
                    <span class="fare-amount">$34.50</span>
                </div>
                
                <div class="route-info">
                    <div class="route-point">
                        <div class="point-icon start"></div>
                        <div class="point-text">
                            <span class="time">10:15 AM</span>
                            <span class="location">123 Startup Blvd</span>
                        </div>
                    </div>
                    <div class="route-line"></div>
                    <div class="route-point">
                        <div class="point-icon end"></div>
                        <div class="point-text">
                            <span class="time">10:42 AM</span>
                            <span class="location">880 Innovation Ave</span>
                        </div>
                    </div>
                </div>

            </div>
            
            <!-- Rating -->
            <div class="feedback-section">
                <h3>Rate your driver</h3>
                <div class="star-rating">
                    <i class="fa-regular fa-star" data-rating="1"></i>
                    <i class="fa-regular fa-star" data-rating="2"></i>
                    <i class="fa-regular fa-star" data-rating="3"></i>
                    <i class="fa-regular fa-star" data-rating="4"></i>
                    <i class="fa-regular fa-star" data-rating="5"></i>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="primary-btn">Done</button>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
