<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ride Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>

<body class="bg-gray-200 flex justify-center items-center min-h-screen">

  <!-- iPhone Container -->
  <div class="w-[390px] h-[844px] bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col">

    <!-- Header -->
      <div class="flex items-center justify-between p-4 border-b">
      <span class="text-xl">←</span>
      <h1 class="font-bold text-lg text-blue-900">Ride in Progress</h1>
    </div>

    <!-- Scroll Area -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- Map Section -->
      <div class="relative bg-gray-300 rounded-2xl h-52 overflow-hidden">
        <div id="map" class="w-full h-full rounded-2xl"></div>

        <button class="absolute top-3 right-3 bg-white p-2 rounded-full shadow hover:bg-gray-100">
          📍
        </button>

        <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 bg-blue-900 text-white px-4 py-1 rounded-full text-sm font-semibold">
          2.4 km to Drop-off
        </div>
      </div>

      <!-- Passenger Card -->
      <div class="bg-gray-50 rounded-2xl p-4 shadow-sm space-y-3">

        <!-- Top -->
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-gray-300 rounded-full"></div>
            <div>
              <h2 id="passengerName" class="font-semibold">Loading...</h2>
              <p id="passengerRating" class="text-sm text-gray-500">⭐ 4.8</p>
            </div>
          </div>

          <div class="flex gap-2">
            <button class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-full font-bold text-lg" onclick="callPassenger()" title="Call Passenger">📞</button>
            <button class="bg-blue-900 hover:bg-blue-800 text-white p-2 rounded-full">💬</button>
          </div>
        </div>

        <hr>

        <!-- Locations -->
        <div class="space-y-2">
          <div>
            <p class="text-xs text-gray-500">Pickup</p>
            <p class="font-medium">123 Central Library</p>
          </div>

          <div class="flex justify-between items-center">
            <div>
              <p class="text-xs text-gray-500">Drop-off</p>
              <p class="font-medium">Central Hospital</p>
            </div>

            <button class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">
              Navigate
            </button>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-gray-100 p-3 rounded-xl">
          <p class="text-xs text-gray-500">Dist.</p>
          <p class="font-bold">5.2</p>
          <p class="text-xs text-gray-400">km</p>
        </div>

        <div class="bg-gray-100 p-3 rounded-xl">
          <p class="text-xs text-gray-500">Time</p>
          <p class="font-bold">18</p>
          <p class="text-xs text-gray-400">min</p>
        </div>

        <div class="bg-gray-100 p-3 rounded-xl">
          <p class="text-xs text-gray-500">Fare</p>
          <p class="font-bold">288</p>
          <p class="text-xs text-gray-400">Rs.</p>
        </div>

        <div class="bg-gray-100 p-3 rounded-xl">
          <p class="text-xs text-gray-500">Pass.</p>
          <p class="font-bold">1</p>
          <p class="text-xs text-gray-400">user</p>
        </div>
      </div>

      <!-- Status Tracker -->
      <div class="bg-gray-50 rounded-2xl p-4 text-center">
        
        <div class="flex justify-between text-xs mb-2">
          <span>Accepted</span>
          <span>Arrived</span>
          <span class="text-yellow-600 font-bold">Started</span>
          <span>Completed</span>
        </div>

        <div class="flex items-center justify-between">
          <div class="w-6 h-6 bg-blue-900 rounded-full"></div>
          <div class="flex-1 h-1 bg-blue-900"></div>
          <div class="w-6 h-6 bg-blue-900 rounded-full"></div>
          <div class="flex-1 h-1 bg-gray-300"></div>
          <div class="w-6 h-6 bg-yellow-400 rounded-full border-4 border-white"></div>
          <div class="flex-1 h-1 bg-gray-300"></div>
          <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
        </div>

        <p class="text-sm mt-3 text-gray-600">
          Ride started at 10:15 AM
        </p>
      </div>

      <!-- Buttons -->
      <button class="w-full bg-blue-900 text-white py-3 rounded-xl font-semibold">
        COMPLETE RIDE
      </button>

      <button class="w-full bg-gray-300 text-gray-700 py-3 rounded-xl font-semibold">
        CANCEL RIDE
      </button>

    </div>
  </div>

  <script>
    // Initialize Mapbox GL map
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWNjZXNzcmlkZSIsImEiOiJjbHp0bDg3bXMwMDAwMnJwNHR4ZTU0MmIyIn0.demo';
    
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [6.9271, 7.3869], // Default: Colombo, Sri Lanka
      zoom: 14,
      pitch: 45,
      bearing: -60
    });

    // Add navigation controls
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');

    // Sample route points
    const pickupPoint = [6.9271, 7.3869]; // Central Library
    const dropoffPoint = [6.9150, 7.4200]; // Central Hospital

    // Add markers
    new mapboxgl.Marker({ color: '#22c55e' })
      .setLngLat(pickupPoint)
      .addTo(map);

    new mapboxgl.Marker({ color: '#ef4444' })
      .setLngLat(dropoffPoint)
      .addTo(map);

    // Add driver current position (animation point)
    const driverMarker = document.createElement('div');
    driverMarker.className = 'w-8 h-8 bg-blue-500 rounded-full border-4 border-white shadow-lg';
    new mapboxgl.Marker(driverMarker)
      .setLngLat([6.9210, 7.4000])
      .addTo(map);

    map.on('load', () => {
      // Add route layer when map loads
      const routeCoordinates = [pickupPoint, [6.9210, 7.4000], dropoffPoint];
      
      map.addSource('route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: routeCoordinates
          }
        }
      });

      map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        layout: {
          'line-join': 'round',
          'line-cap': 'round'
        },
        paint: {
          'line-color': '#3b82f6',
          'line-width': 3
        }
      });
    });

    function callPassenger() {
      alert("Calling passenger...");
      fetch("http://localhost/AccessrideBackend/Driverdashboard/call.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "call_passenger" })
      }).catch(() => console.log("Call initiated"));
    }

    // Load passenger (blind user) name for driver view
    (function loadPassengerName(){
      fetch("http://localhost/AccessrideBackend/Driverdashboard/getride.php")
        .then(res => res.json())
        .then(data => {
          const nameEl = document.getElementById('passengerName');
          const ratingEl = document.getElementById('passengerRating');
          if (!data) return;
          if (data.message) {
            if (nameEl) nameEl.textContent = 'Passenger';
            return;
          }

          const name = data.name || data.passenger_name || data.user_name || data.fullname || (data.first_name && data.last_name ? data.first_name + ' ' + data.last_name : null) || 'Passenger';
          if (nameEl) nameEl.textContent = name;

          if (ratingEl) {
            const rating = data.rating || data.ratings || data.stars || null;
            if (rating) ratingEl.textContent = '⭐ ' + rating;
          }
        })
        .catch(() => {
          const nameEl = document.getElementById('passengerName');
          if (nameEl) nameEl.textContent = 'Passenger';
        });
    })();
  </script>
</body>
</html>
