<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AccessRide Registration</title>

  
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body class="bg-linear-to-br from-blue-100 to-gray-200 min-h-screen flex items-center justify-center p-5">

  <!-- Main Container -->
  <div class="w-full max-w-lg">   

    <!-- Register Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

      <!-- Logo -->
      <div class="text-center mb-8">

        <div class="w-20 h-20 bg-blue-900 rounded-3xl flex items-center justify-center mx-auto shadow-lg">

          <i class="fa-solid fa-wheelchair-move text-white text-4xl"></i>

        </div>

        <h1 class="text-4xl font-bold text-blue-900 mt-5">
          Create Account
        </h1>

        <p class="text-gray-500 mt-2 text-lg">
          Join AccessRide Today
        </p>

      </div>

      <!-- Full Name -->
      <div class="mb-5">

        <label class="block text-blue-900 font-semibold mb-2">
          Full Name
        </label>

        <div class="flex items-center border-2 border-gray-300 rounded-2xl px-4 py-3 focus-within:border-blue-900">

          <i class="fa-solid fa-user text-gray-400"></i>

          <input
            type="text"
            id="fullname"
            placeholder="Enter your full name"
            class="w-full ml-3 outline-none"
          >

        </div>

      </div>

      <!-- Email -->
      <div class="mb-5">

        <label class="block text-blue-900 font-semibold mb-2">
          Email Address
        </label>

        <div class="flex items-center border-2 border-gray-300 rounded-2xl px-4 py-3 focus-within:border-blue-900">

          <i class="fa-regular fa-envelope text-gray-400"></i>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full ml-3 outline-none"
          >

        </div>

      </div>

      <!-- Phone -->
      <div class="mb-5">

        <label class="block text-blue-900 font-semibold mb-2">
          Phone Number
        </label>

        <div class="flex items-center border-2 border-gray-300 rounded-2xl px-4 py-3 focus-within:border-blue-900">

          <i class="fa-solid fa-phone text-gray-400"></i>

          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            class="w-full ml-3 outline-none"
          >

        </div>

      </div>

      <!-- Password -->
      <div class="mb-5">

        <label class="block text-blue-900 font-semibold mb-2">
          Password
        </label>

        <div class="flex items-center border-2 border-gray-300 rounded-2xl px-4 py-3 focus-within:border-blue-900">

          <i class="fa-solid fa-lock text-gray-400"></i>

          <input
            type="password"
            id="password"
            placeholder="Create password"
            class="w-full ml-3 outline-none"
          >

        </div>

      </div>

      <!-- Confirm Password -->
      <div class="mb-6">

        <label class="block text-blue-900 font-semibold mb-2">
          Confirm Password
        </label>

        <div class="flex items-center border-2 border-gray-300 rounded-2xl px-4 py-3 focus-within:border-blue-900">

          <i class="fa-solid fa-lock text-gray-400"></i>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            class="w-full ml-3 outline-none"
          >

        </div>

      </div>

      <!-- Register Button -->
      <button
        onclick="registerUser()"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white py-4 rounded-2xl text-xl font-bold shadow-lg transition duration-300"
      >
        Create Account
      </button>

      <!-- Voice Register -->

<div class="text-center mt-10">

  <button
    id="voiceBtn"
    class="w-24 h-24 bg-yellow-400 hover:bg-yellow-300 rounded-full shadow-lg text-4xl text-yellow-900 transition duration-300 hover:scale-105"
  >

    <i class="fa-solid fa-microphone"></i>

  </button>

  <p class="text-blue-900 font-semibold text-xl mt-4">
    Use Voice to Registration
  </p>

</div>
      <!-- Divider -->
      <div class="flex items-center my-8">

        <div class="flex-1 h-px bg-gray-300"></div>

        <span class="px-4 text-gray-400 text-sm">
          OR
        </span>

        <div class="flex-1 h-px bg-gray-300"></div>

      </div>

      <!-- Login Link -->
      <div class="text-center text-gray-500">

        Already have an account?

        <a href="index.html"
        class="text-blue-900 font-bold hover:underline">
          Login
        </a>

      </div>

    </div>

  </div>

  <script>

    function registerUser(){

      let fullname = document.getElementById("fullname").value;
      let email = document.getElementById("email").value;
      let phone = document.getElementById("phone").value;
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;

      if(
        fullname === "" ||
        email === "" ||
        phone === "" ||
        password === "" ||
        confirmPassword === ""
      ){

        alert("Please fill all fields");

      }
      else if(password !== confirmPassword){

        alert("Passwords do not match");

      }
      else{

        alert("Registration Successful!");

        // Reset Inputs
        document.getElementById("fullname").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";
      }
    }


document.getElementById("voiceBtn")
.addEventListener("click", function(){

  alert("Voice Registration Activated");

});

  </script>

</body>
</html>
