<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AccessRide Login</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    body{
      font-family: Arial, sans-serif;
    }

    .shadow-soft{
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body class="bg-[#dfe1ea] min-lg-screen flex justify-center items-center">

  <div class="w-[380px] bg-[#dfe1ea] p-5">

    
    <div class="flex flex-col items-center mt-4">
      <div class="bg-[#062b84] w-14 h-14 rounded-2xl flex items-center justify-center shadow-soft">
        <i class="fa-solid fa-wheelchair text-white text-5xl"></i>
      </div>

      <h1 class="text-4xl font-bold text-[#062b84] mt-4">
        AccessRide
      </h1>

      <p class="text-gray-600 text-xl">
        Smart Mobility for Everyone
      </p>
    </div>

    <div class="bg-white rounded-2xl p-5 mt-6 shadow-soft">

      <div class="mb-6">
        <label class="text-[#062b84] font-semibold text-lg ml-2">
          Email
        </label>

        <div class="border-2 border-[#062b84] rounded-xl flex items-center px-3 py-3 mt-1">
          <i class="fa-regular fa-envelope text-gray-500 text-xl"></i>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full outline-none ml-3 text-lg"
          />
        </div>
      </div>

      <div>
        <label class="text-[#062b84] font-semibold text-lg ml-2">
          Password
        </label>

        <div class="border-2 border-gray-400 rounded-xl flex items-center px-3 py-3 mt-1">
          <i class="fa-solid fa-lock text-gray-500 text-xl"></i>

          <input
            type="password"
            id="password"
            placeholder="Enter your Password"
            class="w-full outline-none ml-3 text-lg"
          />
        </div>
      </div>

      <div class="text-right mt-4">
        <a href="#" class="text-[#062b84] font-semibold text-lg hover:underline">
          Forgot Password?
        </a>
      </div>

      <button
        onclick="loginUser()"
        class="w-full bg-[#062b84] text-white text-3xl font-bold py-3 rounded-2xl mt-6 shadow-soft hover:bg-[#041f63] transition"
      >
        Login →
      </button>

      <div class="flex flex-col items-center mt-10">

        <button
          id="voiceBtn"
          class="w-28 h-28 bg-yellow-400 rounded-full border-4 border-[#062b84] flex items-center justify-center hover:scale-105 transition"
        >
          <i class="fa-solid fa-microphone text-5xl text-[#7a5a00]"></i>
        </button>

        <p class="text-[#062b84] text-2xl font-semibold mt-5">
          Use voice to login
        </p>
      </div>

      <hr class="my-6">

      <div class="flex justify-center items-center gap-2 text-lg">
        <span class="text-gray-600">Don’t have an account?</span>

        <button class="bg-yellow-400 px-4 py-1 rounded-xl font-bold hover:bg-yellow-300">
          Sign up
        </button>
      </div>

    </div>

    <div class="grid grid-cols-2 gap-4 mt-6">

      <div class="bg-white rounded-2xl p-4 flex items-center gap-3 shadow-soft">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <i class="fa-solid fa-shield text-[#062b84] text-xl"></i>
        </div>

        <div>
          <h3 class="font-bold text-gray-700">Secure</h3>
          <p class="text-gray-600">Login</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 flex items-center gap-3 shadow-soft">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <i class="fa-solid fa-headset text-[#062b84] text-xl"></i>
        </div>

        <div>
          <h3 class="font-bold text-gray-700">24/7</h3>
          <p class="text-gray-600">Support</p>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
